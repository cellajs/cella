<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/common/icons/favicon-64x64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/common/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/common/icons/favicon-16x16.png">
  <link rel="icon" href="/static/common/icons/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <title>
    <%= title %>
  </title>
  <meta name="description" content="<%= description %>" />
  <meta name="keywords" content="<%= keywords %>" />
  <meta name="author" content="<%= author %>" />

  <meta property="og:title" content="<%= title %>" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="<%= url %>" />
  <meta property="og:description" content="<%= description %>" />
  <meta property="og:site_name" content="<%= title %>" />
  <meta property="og:image" content="/thumbnail.png">

  <link rel="logo" type="image/png" href="/static/common/logo/logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/common/icons/favicon-180x180.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/static/common/icons/favicon-512x512.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/common/icons/favicon-192x192.png" />

  <link rel="preconnect" href="<%= apiUrl %>" crossorigin>
  
  <!-- The page background for the browser chrome: light until Themer sets the stored mode's. -->
  <meta name="theme-color" content="#ffffff" />

  <!-- The one font file every page needs, at the URL tailwind.css names: every weight, Latin script. -->
  <link rel="preload" href="/static/ui/inter-latin-wght-5.3.0.woff2" as="font" type="font/woff2" crossorigin>


</head>

<body class="group/body">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
