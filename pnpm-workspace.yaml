---
allowBuilds:
  # `@evilmartians/lefthook` bundles every platform's binary, `lefthook` installs one. A checkout installed before the
  # switch still holds the old package, and pnpm fails its next install without a verdict on it. Remove once every
  # checkout has reinstalled.
  '@evilmartians/lefthook': false
  esbuild: true
  lefthook: true
  protobufjs: false
blockExoticSubdeps: true
# Optional dependencies of code paths the app never runs: jspdf's .html() and SVG rendering (canvg, html2canvas,
# core-js) and pdfjs's Node canvas (PDFs render in the browser).
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
  - canvg
  - core-js
  - html2canvas
# A version installs a day after its publish (supply-chain guard), so a release that needs a new create-cella waits for it
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Only the CLI version a release needs before its day is up: the entry is removed, or bumped when a release needs another.
  - '@cellajs/cli@0.6.0'
overrides:
  # BlockNote's shadcn kit asks for lucide-react 0.525; with the app's copy its few icons follow LucideProvider's stroke.
  '@blocknote/shadcn>lucide-react': ^1.59.0
  # instrumentation-pg lists these type packages as runtime dependencies, so every service image installed them.
  '@opentelemetry/instrumentation-pg>@types/pg': '-'
  '@opentelemetry/instrumentation-pg>@types/pg-pool': '-'
  # Tailwind pins lightningcss exactly, one minor behind Vite: a second set of native bindings until it catches up.
  '@tailwindcss/node>lightningcss': ^1.33.0
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  # Storybook pins an older oxc-resolver exactly; knip's version serves both.
  oxc-resolver: 11.24.2
  postcss-selector-parser@<6.1.5: ^6.1.5
  # react-scan's CLI linter (eslint, oxlint, a second TypeScript), declared as "latest"; the app imports only the runtime.
  react-scan>react-doctor: '-'
  zod@<4.6.6: ^4.6.6
packages:
  - mcp
  - oauth
  - jobs
  - backend
  - cdc
  - shared
  - frontend
  - infra
  - sdk
  - studio
  - yjs
  - bench
  - a11y
updateConfig:
  # Packages that `pnpm outdated`, `pnpm update --latest` and `pnpm cella audit` leave out. `pnpm audit` still checks them.
  ignoreDependencies:
    # 2.6 rewrites about 280 files and adds new lint errors, so it waits for an upgrade of its own (cella#1450).
    - '@biomejs/biome'
    # This package only hosts the JS compiler API for SDK codegen; 7, the native rewrite, no longer has that API.
    - typescript
