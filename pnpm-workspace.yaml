---
allowBuilds:
  '@evilmartians/lefthook': true
  core-js: false
  esbuild: true
  protobufjs: false
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@cellajs/cli'
overrides:
  esbuild@<0.28.1: ^0.28.1
  http-cache-semantics@<=4.2.0: ^4.3.0
  joi@<17.13.8: ^17.13.8
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  postcss-selector-parser@<7.1.6: ^7.1.6
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
packages:
  - mcp
  - oauth
  - jobs
  - backend
  - cdc
  - shared
  - frontend
  - infra
  - sdk
  - studio
  - yjs
  - bench
  - a11y
peerDependencyRules:
  allowedVersions:
    vite: '8'
publicHoistPattern:
  - pdfjs-dist
