---
allowBuilds:
  '@evilmartians/lefthook': true
  '@playwright/browser-chromium': false
  core-js: false
  esbuild: true
  protobufjs: false
  unix-dgram: false
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@cellajs/cli'
  - moment@2.31.0
overrides:
  csv-parse@<7.0.2: ^7.0.2
  esbuild@<0.28.1: ^0.28.1
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  moment@>=2.29.2 <2.31.0: ^2.31.0
packageExtensions:
  '@artilleryio/sketches-js':
    dependencies:
      protobufjs: ^7.2.4
  artillery:
    dependencies:
      esbuild: ^0.28.1
packages:
  - mcp
  - oauth
  - jobs
  - backend
  - cdc
  - shared
  - frontend
  - infra
  - sdk
  - studio
  - yjs
  - bench
patchedDependencies:
  artillery@2.0.34: patches/artillery@2.0.34.patch
peerDependencyRules:
  allowedVersions:
    vite: '8'
publicHoistPattern:
  - pdfjs-dist
