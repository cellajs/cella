---
allowBuilds:
  # `@evilmartians/lefthook` bundles every platform's binary, `lefthook` installs one. A checkout installed before the
  # switch still holds the old package, and pnpm fails its next install without a verdict on it. Remove once every
  # checkout has reinstalled.
  '@evilmartians/lefthook': false
  esbuild: true
  lefthook: true
  protobufjs: false
blockExoticSubdeps: true
# Optional dependencies of code paths the app never runs: jspdf's .html() and SVG rendering (canvg, html2canvas,
# core-js) and pdfjs's Node canvas (PDFs render in the browser).
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
  - canvg
  - core-js
  - html2canvas
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@cellajs/cli'
overrides:
  # Tailwind pins lightningcss exactly, one minor behind Vite: a second set of native bindings until it catches up.
  '@tailwindcss/node>lightningcss': ^1.33.0
  # drizzle-kit asks for esbuild 0.25; one esbuild (and one set of native bindings) serves every workspace.
  drizzle-kit>esbuild: ^0.28.1
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  # Storybook pins an older oxc-resolver exactly; knip's version serves both.
  oxc-resolver: 11.24.2
  postcss-selector-parser@<7.1.6: ^7.1.6
  # react-scan's CLI linter (eslint, oxlint, a second TypeScript), declared as "latest"; the app imports only the runtime.
  react-scan>react-doctor: '-'
packages:
  - mcp
  - oauth
  - jobs
  - backend
  - cdc
  - shared
  - frontend
  - infra
  - sdk
  - studio
  - yjs
  - bench
  - a11y
