name: CI

# Deny-by-default: each job opts in to the scopes it actually needs.
permissions: {}

# CI runs on pull_request only (there is no merge queue). Two tiers of checks:
#   • Every PR: cheap checks (lint, pr-title, schema-bust-gate, frontend-build, build-services) for fast feedback.
#   • Release PR only: the heavy suites (test, storybook-test, all docker-images targets) run on the
#     release-please PR, which every merge to main refreshes. That PR is what you merge to cut the
#     release + deploy, so gating its merge gates production. On feature PRs these jobs are skipped.
# The one required status check is `ci-passed`, the last job, which waits for all the others.
on:
  pull_request:
    # `infra-rewrite` is the integration branch of the infra rewrite; its entry leaves with the landing on main.
    branches: [main, infra-rewrite]

# Cancel older runs of the same PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint the PR title as a Conventional Commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            chore
            build
            ci
            style
            test

  # Runs linting. Cheap: runs on both PR (fast feedback) and merge queue (gate).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Full history: lens:check compares dated lens modules against their first commit (append-only guard)
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm biome check . --error-on-warnings

      # `pnpm check` ends with these fixes. One that is still open here gets applied in every app after
      # its next sync, as a change in a file the app never touched.
      - name: Check Biome has no fix left to apply
        run: pnpm biome check --write --unsafe && git diff --exit-code

      - name: Run style checks (terminology / docs / comments / frontend)
        run: pnpm style

      - name: Run lens checks (append-only / collision / purity / wire completeness)
        run: pnpm --filter shared lens:check

      # knip loads the vitest configs, which read DB_TEST_PORT from backend/.env
      - name: Check for unused files and dependencies
        run: |
          cp ./backend/.env.example ./backend/.env
          pnpm unused

      # compose.gen.yml is a committed artifact read at deploy time
      # (infra/resources/compute.ts), so a stale copy must fail the PR.
      - name: Check compose model artifact is committed
        run: pnpm --filter infra compose:check

  # Production frontend build. Cheap (~1 min): runs on every PR. Some breakage only surfaces at
  # build time (a repo-doc import the MDX include regex refuses, a broken relative import in a
  # docs wrapper) and would otherwise fail the release deploy, which builds the frontend from the tag.
  # Apps keep their release-please CHANGELOG.md at the repo root, a path cella itself never builds.
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend build

  # Typecheck plus the three service bundles (backend, cdc, yjs), each booted once. Nothing else in CI typechecks (the
  # pre-commit hook does, and --no-verify skips it), and the bundles are otherwise first built and started by the
  # release deploy, where a package missing from the keep-on-disk list fails (0.12.1). ~3 min, every PR.
  build-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm ts

      - name: Build service bundles
        run: pnpm --filter backend --filter cdc-worker --filter yjs-worker build

      - name: Create .env file
        run: cp ./backend/.env.example ./backend/.env

      # A bundle can build and still crash at start (a workspace import left as a bare import), which a deploy finds
      # only as a cutover that never turns healthy. Migrates, boots and stops each service on the test database.
      - name: Boot the service bundles
        run: pnpm boot:check

      # A new app starts from config.template.ts: no federation and no `sso` method. This repo's own config
      # has both, so code that leans on them passes the typecheck above and fails in every new app (0.16.0).
      # `--tests` also runs the sign-in and connections suites under that config, on the database the boot used.
      - name: Typecheck and run the sign-in tests as a new app
        run: pnpm template:check --tests

  # The test suites against PostgreSQL, one job per suite, so the release PR waits for the longest one. Heavy: runs on
  # the release PR, and in an app on the sync PR (`cella/sync/<stamp>`, the branch `pnpm cella sync` opens), where
  # upstream changes first meet the app's code. Each job starts the `db_test` compose container (DB_TEST_PORT) and
  # applies migrations in the Vitest global setup, so it needs no service container.
  test:
    # Same-repo branch only: release-please and the sync push their branches into this
    # repo, so a PR from another repository (whose branch name its author fully controls)
    # cannot spoof a prefix to trigger the heavy suites. head_ref is set only for
    # pull_request events.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'release-please--branches--main') || startsWith(github.head_ref, 'cella/sync/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [full, runtime, app-shape]
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Create .env files
        run: |
          cp ./backend/.env.example ./backend/.env
          cp ./frontend/.env.example ./frontend/.env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI spec
        run: pnpm sdk

      # `pnpm test:full` without its coverage: CI keeps no report, and coverage slows every test.
      - name: Run tests (full mode)
        if: matrix.suite == 'full'
        run: pnpm docker:test && pnpm exec cross-env TEST_MODE=full vitest run --silent=passed-only

      # RLS parity: the backend core suite again as the RLS-subject runtime_role. Allow and deny
      # results must match the superuser run of the full suite, proving authorization does not lean on RLS.
      - name: Run backend tests as runtime_role
        if: matrix.suite == 'runtime'
        run: pnpm test:core:runtime

      # The core suites again with a config shaped like an app's: listed surfaces, another feature flag, a stricter
      # member policy. A template test that leans on the template's own values fails here and not in an app's sync.
      - name: Run core tests with an app-shaped config
        if: matrix.suite == 'app-shape'
        run: pnpm app-shape:check

  # The production images are otherwise built for the first time by the release deploy: 0.11.0 failed there on a
  # Node 26 base image without corepack, 0.12.1 on a worker env leak and an undeclared dependency that crashed every
  # image. A PR that changes the shared base stage's inputs (the Dockerfile, the package manager pin) builds that stage;
  # the release PR and an app's sync PR build every target, without pushing. The targets start from the same stages,
  # so one job builds them on one layer cache.
  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0 # need base-branch blobs to diff

      # Every target on the same-repo branches the heavy suites run on (see the `test` job).
      - name: Decide what to build
        id: scope
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          ALL_TARGETS: ${{ github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'release-please--branches--main') || startsWith(github.head_ref, 'cella/sync/')) }}
        run: |
          set -euo pipefail
          if [ "$ALL_TARGETS" = true ]; then
            echo "base=true" >> "$GITHUB_OUTPUT"
            echo "targets=backend cdc yjs" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --quiet "origin/$BASE_REF"...HEAD -- Dockerfile package.json pnpm-lock.yaml pnpm-workspace.yaml; then
            echo "Image inputs unchanged; skipping the base-stage build."
          else
            echo "base=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the shared base stage
        if: steps.scope.outputs.base == 'true'
        run: docker build --build-arg NODE_VERSION="$(jq -r .engines.node package.json)" --target manifests -t base-check .

      - name: pnpm resolves from the pin inside the image
        if: steps.scope.outputs.base == 'true'
        run: docker run --rm base-check pnpm --version

      - name: Build the service images
        if: steps.scope.outputs.targets != ''
        env:
          TARGETS: ${{ steps.scope.outputs.targets }}
        run: |
          for target in $TARGETS; do
            docker build --build-arg NODE_VERSION="$(jq -r .engines.node package.json)" --target "$target" -t "$target-check" .
          done

  # What merging owes an operator, said without a key (infra/tasks/privileged-check.ts): the base and the head each render, under mocks, the
  # identities and the privileged resources they declare, and the job summary lists what an Owner moment or an apply must write before the
  # next deploy. It holds no secret and passes either way; a head the render cannot read fails it.
  privileged-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Checkout the base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install the head
        run: pnpm install --frozen-lockfile --filter infra... --filter shared...

      - name: Install the base
        working-directory: .base
        run: pnpm install --frozen-lockfile --filter infra... --filter shared...

      - name: Say what the change owes
        run: pnpm --silent --filter infra exec tsx tasks/privileged-check.ts --base "$GITHUB_WORKSPACE/.base"

  # Storybook component tests (Vitest browser mode via Playwright). Heavy: runs on the release PR and an app's sync PR,
  # so a story that breaks on a feature PR fails the release PR; run `pnpm test:storybook` before merging frontend work.
  storybook-test:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'release-please--branches--main') || startsWith(github.head_ref, 'cella/sync/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Create .env files
        run: |
          cp ./backend/.env.example ./backend/.env
          cp ./frontend/.env.example ./frontend/.env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SDK (types imported by stories)
        run: pnpm sdk

      - name: Install Playwright browser
        run: pnpm --filter frontend exec playwright install --with-deps chromium chromium-headless-shell

      - name: Run Storybook tests
        run: pnpm --filter frontend exec vitest run --project=storybook

  # Schema cache-bust gate: a breaking OpenAPI change to cached entity shapes
  # must be accompanied by a `clientCacheVersion` bump (shared/config/config.default.ts)
  # so offline clients wipe stale persisted query data. It compares the committed
  # spec (sdk/gen/openapi.json, which the commit hook regenerates) of base and head.
  schema-bust-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0 # need base-branch blobs to diff

      - name: Breaking-change gate
        # The checkout is the PR's merge commit: its first parent is the base the PR merges into, whatever the base
        # branch did since.
        run: |
          set -euo pipefail
          BASE=HEAD^1
          SPEC=sdk/gen/openapi.json
          CFG=shared/config/config.default.ts

          # No base spec (first introduction) → nothing to compare.
          if ! git show "$BASE:$SPEC" > /tmp/base-openapi.json 2>/dev/null; then
            echo "No base OpenAPI spec; skipping gate."
            exit 0
          fi
          cp "$SPEC" /tmp/head-openapi.json

          # Classify breaking changes (oasdiff exits non-zero on breaking errors).
          # Pinned by digest (v1.20.0) so a repushed tag cannot swap the image that
          # runs in CI with access to the mounted /tmp. Bump both tag comment and digest together.
          set +e
          docker run --rm -v /tmp:/specs tufin/oasdiff@sha256:d0a6de7b3389adc358dd34981f6091a907dbd788ce21b3d51f315a00928e3e01 \
            breaking /specs/base-openapi.json /specs/head-openapi.json --fail-on ERR
          BREAKING=$?
          set -e
          if [ "$BREAKING" -eq 0 ]; then
            echo "✅ No breaking OpenAPI changes."
            exit 0
          fi
          # 1 is oasdiff's verdict on the spec. Any other code means it never gave one: Docker answers 125 when the
          # image pull fails (a registry rate limit), oasdiff 100 and up when it cannot read a spec.
          if [ "$BREAKING" -ne 1 ]; then
            echo "::error::oasdiff did not run (exit $BREAKING), so the gate has no verdict on the spec. Rerun the job."
            exit 1
          fi

          # Breaking change present → require a clientCacheVersion bump in the same PR.
          BASE_BUSTER=$(git show "$BASE:$CFG" | grep -oE "clientCacheVersion: '[^']+'" || true)
          HEAD_BUSTER=$(grep -oE "clientCacheVersion: '[^']+'" "$CFG" || true)
          echo "clientCacheVersion base=[$BASE_BUSTER] head=[$HEAD_BUSTER]"
          if [ -n "$HEAD_BUSTER" ] && [ "$BASE_BUSTER" != "$HEAD_BUSTER" ]; then
            echo "✅ Breaking change accompanied by a clientCacheVersion bump."
            exit 0
          fi

          echo "::error file=$CFG::Breaking OpenAPI change detected without a clientCacheVersion bump."
          echo "Bump appConfig.clientCacheVersion (e.g. 'v1' → 'v2') in $CFG and use a 'feat!' PR title so clients wipe stale cache."
          exit 1

  # The one required status check: the `main` ruleset names this job alone, so a job joins the merge gate by joining
  # `needs`. A skipped job passes (the heavy suites skip on feature PRs); a failed or cancelled one fails the check.
  ci-passed:
    if: always()
    needs: [pr-title, lint, frontend-build, build-services, test, docker-images, storybook-test, schema-bust-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::A job above failed or was cancelled."
            exit 1
          fi
