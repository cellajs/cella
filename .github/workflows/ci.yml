name: CI

# Deny-by-default: each job opts in to the scopes it actually needs.
permissions: {}

# CI runs on pull_request only (there is no merge queue). Two tiers of checks:
#   • Every PR: lint, frontend-build, build-services, schema-bust-gate, privileged-changes, and docker-images when the
#     image inputs changed. Cheap, for fast feedback.
#   • Release PR and an app's upgrade PR only: the heavy suites (every test suite, every docker-images target). Every
#     merge to main refreshes the release-please PR, and merging it cuts the release + deploy, so gating its merge gates
#     production. On feature PRs these jobs are skipped.
# The required status check is `ci-passed`, the last job, which waits for all the others. The PR title has its
# own workflow and check (pr-title.yml). Every job installs the workspace through .github/actions/install-workspace.
on:
  pull_request:
    branches: [main]

# Cancel older runs of the same PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Full history: lens:check compares dated lens modules against their first commit (append-only guard)
          fetch-depth: 0
          persist-credentials: false

      # knip loads the vitest configs, and the backend env module wants the secrets of .env
      - name: Install the workspace
        uses: ./.github/actions/install-workspace
        with:
          env-files: true

      # `pnpm check` ends with these fixes. One that is still open here gets applied in every app after
      # its next upgrade, as a change in a file the app never touched.
      - name: Run Biome and check it has no fix left to apply
        run: pnpm biome check --write --unsafe --error-on-warnings && git diff --exit-code

      - name: Run style checks (terminology / docs / comments / frontend)
        run: pnpm cella style

      - name: Run lens checks (append-only / collision / expand-before-contract / purity / wire completeness)
        run: pnpm --filter shared lens:check

      - name: Check for unused files and dependencies
        run: pnpm unused

      # compose.gen.yml is a committed artifact read at deploy time
      # (the switch step of infra/tasks/deploy-run.ts), so a stale copy must fail the PR.
      - name: Check compose model artifact is committed
        run: pnpm --filter infra compose:check

      # The pre-commit hook regenerates sdk/gen and stages it; a commit made with --no-verify records a stale SDK, which
      # the build-services typecheck and the schema-bust-gate (it reads the committed spec) would then judge in place of
      # the routes. Here and not in build-services: this job ends a minute earlier.
      - name: Check the committed SDK matches the routes
        run: pnpm sdk && git diff --exit-code -- sdk/gen

  # The frontend as the builder machine builds it at a deploy: the builder's own script (infra/lib/builder/builder-machine.ts), in the
  # deployed mode, which generates the environment's OpenAPI spec from the example env first and then builds. Runs on every PR (~2 min),
  # so a break only a deploy would meet (an env value a deployed mode requires that the example env lost, a repo-doc import the MDX
  # include regex refuses, a broken relative import in a docs wrapper) fails here and not at the release deploy, which builds from the tag.
  # Apps keep their release-please CHANGELOG.md at the repo root, a path cella itself never builds.
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install the workspace
        uses: ./.github/actions/install-workspace

      - name: Build the frontend with the builder's script, in production mode
        env:
          APP_MODE: production
        run: |
          pnpm --silent --filter infra builder-script frontend > "$RUNNER_TEMP/builder-frontend.sh"
          bash -eo pipefail "$RUNNER_TEMP/builder-frontend.sh"

  # Typecheck plus the three service bundles (backend, cdc, yjs), each booted once. Nothing else in CI typechecks (the
  # pre-commit hook does, and --no-verify skips it), and the bundles are otherwise first built and started by the
  # release deploy, where a package missing from the keep-on-disk list fails (0.12.1). ~2 min, every PR.
  build-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install the workspace
        uses: ./.github/actions/install-workspace
        with:
          env-files: true

      - name: Typecheck
        run: pnpm ts

      - name: Build service bundles
        run: pnpm --filter backend --filter cdc-worker --filter yjs-worker build

      # A bundle can build and still crash at start (a workspace import left as a bare import), which a deploy finds
      # only as a switch whose new machine never turns healthy. Migrates, boots and stops each service on the test database.
      - name: Boot the service bundles
        run: pnpm boot:check

      # A new app starts from config.template.ts: no federation and no `sso` method. This repo's own config
      # has both, so code that leans on them passes the typecheck above and fails in every new app (0.16.0).
      # `--tests` also runs the sign-in and connections suites under that config, on the database the boot used.
      - name: Typecheck and run the sign-in tests as a new app
        run: pnpm template:check --tests

  # The test suites against PostgreSQL, one job per suite, so the release PR waits for the longest one. Heavy: runs on
  # the release PR, and in an app on the upgrade PR (`cella/upgrade/<stamp>`, the branch `pnpm cella upgrade` opens), where
  # upstream changes first meet the app's code. Each job starts the `db_test` compose container and
  # applies migrations in the Vitest global setup, so it needs no service container.
  test:
    # Same-repo branch only: release-please and the upgrade push their branches into this
    # repo, so a PR from another repository (whose branch name its author fully controls)
    # cannot spoof a prefix to trigger the heavy suites. The docker-images job repeats this condition.
    if: github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'release-please--branches--main') || startsWith(github.head_ref, 'cella/upgrade/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `pnpm test:full` without its coverage: CI keeps no report, and coverage slows every test.
          - suite: full
            run: pnpm docker:test && pnpm exec cross-env TEST_MODE=full vitest run --silent=passed-only

          # RLS parity: the backend core suite again as the RLS-subject runtime_role. Allow and deny
          # results must match the superuser run of the full suite, proving authorization does not lean on RLS.
          - suite: runtime
            run: pnpm test:core:runtime

          # The core suites again with a config shaped like an app's: listed surfaces, another feature flag, a stricter
          # member policy. A template test that leans on the template's own values fails here and not in an app's sync.
          - suite: app-shape
            run: pnpm app-shape:check

          # Storybook component tests (Vitest browser mode via Playwright). A story that breaks on a feature PR fails
          # the release PR; run `pnpm test:storybook` before merging frontend work.
          - suite: storybook
            run: pnpm --filter frontend exec playwright install --with-deps chromium chromium-headless-shell && pnpm test:storybook
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install the workspace
        uses: ./.github/actions/install-workspace
        with:
          env-files: true

      - name: Run the ${{ matrix.suite }} suite
        run: ${{ matrix.run }}

  # The production images are otherwise built for the first time by the release deploy: 0.11.0 failed there on a
  # Node 26 base image without corepack, 0.12.1 on a worker env leak and an undeclared dependency that crashed every
  # image. A PR that changes the shared base stage's inputs (the Dockerfile, the package manager pin) builds that stage;
  # the release PR and an app's upgrade PR build every target, without pushing. The targets start from the same stages,
  # so one job builds them on one layer cache.
  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The checkout is the PR's merge commit, so its first parent is the base the PR merges into.
          fetch-depth: 2
          persist-credentials: false

      # Every target on the same-repo branches the heavy suites run on (the `test` job's condition).
      - name: Decide what to build
        id: scope
        env:
          ALL_TARGETS: ${{ github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'release-please--branches--main') || startsWith(github.head_ref, 'cella/upgrade/')) }}
        run: |
          set -euo pipefail
          if [ "$ALL_TARGETS" = true ]; then
            echo "targets=manifests backend cdc yjs" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^1 HEAD -- Dockerfile package.json pnpm-lock.yaml pnpm-workspace.yaml; then
            echo "Image inputs unchanged; skipping the base-stage build."
          else
            echo "targets=manifests" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the images
        if: steps.scope.outputs.targets != ''
        env:
          TARGETS: ${{ steps.scope.outputs.targets }}
        run: |
          for target in $TARGETS; do
            docker build --build-arg NODE_VERSION="$(jq -r .engines.node package.json)" --target "$target" -t "$target-check" .
          done

      - name: pnpm resolves from the pin inside the image
        if: steps.scope.outputs.targets != ''
        run: docker run --rm manifests-check pnpm --version

  # What merging owes an operator, said without a key (infra/tasks/privileged-check.ts): the base and the head each render, under mocks, the
  # identities and the privileged resources they declare, and the job summary lists what an Owner moment or an apply must write before the
  # next deploy. It holds no secret and passes either way; a head the render cannot read fails it, and `ci-passed` with it. On the release
  # PR it fails while the release describes the app otherwise than an environment's last apply, which each apply publishes as a repository
  # variable: merged, its deploy would stop at apply needed.
  privileged-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Checkout the base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          persist-credentials: false

      - name: Install the head
        uses: ./.github/actions/install-workspace
        with:
          filter: --filter infra... --filter shared...

      - name: Install the base
        working-directory: .base
        run: pnpm install --frozen-lockfile --filter infra... --filter shared...

      - name: Say what the change owes
        env:
          REPOSITORY_VARIABLES: ${{ toJSON(vars) }}
          RELEASE_FLAG: ${{ startsWith(github.head_ref, 'release-please--branches--main') && '--release' || '' }}
        run: pnpm --silent --filter infra exec tsx tasks/privileged-check.ts --base "$GITHUB_WORKSPACE/.base" $RELEASE_FLAG

  # Schema cache-bust gate: a breaking OpenAPI change to cached entity shapes
  # must be accompanied by a `clientCacheVersion` bump (shared/config/config.default.ts)
  # so offline clients wipe stale persisted query data. It compares the committed
  # spec (sdk/gen/openapi.json, which build-services checks is fresh) of base and head.
  schema-bust-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The checkout is the PR's merge commit, so its first parent is the base the PR merges into.
          fetch-depth: 2
          persist-credentials: false

      - name: Breaking-change gate
        run: |
          set -euo pipefail
          BASE=HEAD^1
          SPEC=sdk/gen/openapi.json
          CFG=shared/config/config.default.ts
          SPECS=$(mktemp -d)

          # No base spec (first introduction) → nothing to compare.
          if ! git show "$BASE:$SPEC" > "$SPECS/base.json" 2>/dev/null; then
            echo "No base OpenAPI spec; skipping gate."
            exit 0
          fi
          cp "$SPEC" "$SPECS/head.json"

          # Classify breaking changes (oasdiff exits non-zero on breaking errors).
          # Pinned by digest (v1.20.0) so a repushed tag cannot swap the image that
          # runs in CI with access to the mounted specs. Bump both tag comment and digest together.
          BREAKING=0
          docker run --rm -v "$SPECS:/specs" tufin/oasdiff@sha256:d0a6de7b3389adc358dd34981f6091a907dbd788ce21b3d51f315a00928e3e01 \
            breaking /specs/base.json /specs/head.json --fail-on ERR || BREAKING=$?
          if [ "$BREAKING" -eq 0 ]; then
            echo "✅ No breaking OpenAPI changes."
            exit 0
          fi
          # 1 is oasdiff's verdict on the spec. Any other code means it never gave one: Docker answers 125 when the
          # image pull fails (a registry rate limit), oasdiff 100 and up when it cannot read a spec.
          if [ "$BREAKING" -ne 1 ]; then
            echo "::error::oasdiff did not run (exit $BREAKING), so the gate has no verdict on the spec. Rerun the job."
            exit 1
          fi

          # Breaking change present → require a clientCacheVersion bump in the same PR.
          BASE_BUSTER=$(git show "$BASE:$CFG" | grep -oE "clientCacheVersion: '[^']+'" || true)
          HEAD_BUSTER=$(grep -oE "clientCacheVersion: '[^']+'" "$CFG" || true)
          echo "clientCacheVersion base=[$BASE_BUSTER] head=[$HEAD_BUSTER]"
          if [ -n "$HEAD_BUSTER" ] && [ "$BASE_BUSTER" != "$HEAD_BUSTER" ]; then
            echo "✅ Breaking change accompanied by a clientCacheVersion bump."
            exit 0
          fi

          echo "::error file=$CFG::Breaking OpenAPI change detected without a clientCacheVersion bump."
          echo "Bump appConfig.clientCacheVersion (e.g. 'v1' → 'v2') in $CFG and use a 'feat!' PR title so clients wipe stale cache."
          exit 1

  # The `main` ruleset requires this job and `pr-title`, so a job of this workflow joins the merge gate by joining
  # `needs`. A skipped job passes (the heavy suites skip on feature PRs); a failed or cancelled one fails the check.
  ci-passed:
    if: always()
    needs: [lint, frontend-build, build-services, test, docker-images, privileged-changes, schema-bust-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A job above failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
