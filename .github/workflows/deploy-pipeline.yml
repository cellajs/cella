name: Deploy pipeline

# The whole deploy pipeline as a reusable workflow: ONE `infra deploy` command
# (preflights, lock, a builder machine for a release not built yet, stack
# update, waved rollout, verify, entry publish, smoke). Apps call this from
# their thin deploy.yml and never edit this file; secrets arrive via
# `secrets: inherit`.

permissions: {}

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string

env:
  NODE_VERSION: '26'

# Jobs that hold secrets, and `setup`, whose outputs they interpolate, install without the pnpm cache: every job
# saves the store under one lockfile-hashed key, so a secretless job running third-party build code could plant a
# package there (guarded by infra/tests/unit/ci-workflows.test.ts).
jobs:
  # -------------------------------------------------------------------------
  # Determine the environment and the release. The heavy test + storybook
  # suites already ran as required checks on the release-please PR (see
  # .github/workflows/ci.yml), so deploy assumes validated code. A manual
  # workflow_dispatch bypasses those checks by design.
  # -------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.derive.outputs.environment }}
      image_tag: ${{ steps.derive.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter infra... --filter shared...

      - name: Derive resource names from shared config
        id: derive
        env:
          ENV: ${{ inputs.environment || 'production' }}
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: pnpm --silent --filter infra print-deploy-env "$ENV" --git-ref "$GIT_REF" --git-sha "$GIT_SHA" >> $GITHUB_OUTPUT

  # -------------------------------------------------------------------------
  # The deploy: ONE command (infra/tasks/deploy.ts) owns everything:
  # preflights, stack lock, a builder machine when the release's images or
  # frontend files are missing, base stack update, waved rollout with LB
  # cutovers, public version verification, atomic frontend entry publish,
  # smoke checks, boot diagnostics on failure. CI stays a thin trigger; any CI
  # system with the SCW_* secrets can run the same command.
  # -------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    # A release not built yet waits for the builder machine (about ten minutes cold), and cold rollouts of many services need headroom.
    timeout-minutes: 50
    needs: [setup]
    permissions:
      contents: read
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Only the workspaces the deploy command runs: no app dependencies, so
      # none of their install scripts run in the one job that holds the deploy
      # secrets. The app is built on the builder machine.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter infra... --filter shared...

      - name: Install Pulumi CLI (at the SDK version)
        uses: ./.github/actions/pulumi-cli

      - name: Deploy ${{ needs.setup.outputs.image_tag }} to ${{ needs.setup.outputs.environment }}
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter infra run deploy --mode "${{ needs.setup.outputs.environment }}" --sha "${{ needs.setup.outputs.image_tag }}" --git-ref "${{ github.ref }}" --defer-reap

  # -------------------------------------------------------------------------
  # Reap the generations the deploy displaced. --defer-reap above leaves the
  # old VMs running (detached from every LB pool) so verification, entry
  # publish, and smoke run minutes earlier; this follow-up update destroys
  # them off the critical path. A failure here is visible but not urgent: the
  # displaced VMs only cost money, and any later stack update (including the
  # next deploy) converges them.
  # -------------------------------------------------------------------------
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    permissions:
      contents: read
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter infra... --filter shared...

      - name: Install Pulumi CLI (at the SDK version)
        uses: ./.github/actions/pulumi-cli

      - name: Reap displaced generations in ${{ needs.setup.outputs.environment }}
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: pnpm --filter infra run reap --mode "${{ needs.setup.outputs.environment }}" --sha "${{ needs.setup.outputs.image_tag }}"

# GitHub creates one deployment record per environment-declaring job
# (secrets are environment-scoped, so that is every secret-using job,
# matrix legs included) and offers no way to opt out. The records are
# write-only audit noise; the accepted clutter keeps GitHub-specific
# pruning administration out of the deploy path.
