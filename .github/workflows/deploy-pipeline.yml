name: Deploy pipeline

# The whole deploy pipeline as a reusable workflow: build images + frontend,
# then ONE `infra deploy` command (preflights, lock, stack update, waved
# rollout, verify, entry publish, smoke). Apps call this from their thin
# deploy.yml and never edit this file; secrets arrive via `secrets: inherit`.

permissions: {}

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string

env:
  NODE_VERSION: '24'

jobs:
  # -------------------------------------------------------------------------
  # Determine environment and detect which services changed. The heavy test +
  # storybook suites already ran as required checks on the release-please PR
  # (see .github/workflows/ci.yml), so deploy assumes validated code and goes
  # straight to build + rollout. A manual workflow_dispatch bypasses those
  # checks by design.
  # -------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.derive.outputs.environment }}
      pulumi_stack: ${{ steps.derive.outputs.pulumi_stack }}
      registry_ns: ${{ steps.derive.outputs.registry_ns }}
      frontend_bucket: ${{ steps.derive.outputs.frontend_bucket }}
      state_bucket: ${{ steps.derive.outputs.state_bucket }}
      region: ${{ steps.derive.outputs.region }}
      enabled_services_json: ${{ steps.derive.outputs.enabled_services_json }}
      image_tag: ${{ steps.derive.outputs.image_tag }}
      build_images_matrix: ${{ steps.derive.outputs.build_images_matrix }}
      primary_rollout_matrix: ${{ steps.derive.outputs.primary_rollout_matrix }}
      roll_rest_matrix: ${{ steps.derive.outputs.roll_rest_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter infra... --filter shared...

      - name: Derive resource names from shared config
        id: derive
        env:
          ENV: ${{ inputs.environment || 'production' }}
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: pnpm --silent --filter infra print-deploy-env "$ENV" --git-ref "$GIT_REF" --git-sha "$GIT_SHA" >> $GITHUB_OUTPUT

  # -------------------------------------------------------------------------
  # Build and push Docker images
  # -------------------------------------------------------------------------
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.build_images_matrix) }}
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: rg.${{ needs.setup.outputs.region }}.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push ${{ matrix.service }} image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Stage within a multi-target Dockerfile; empty for single-target
          # files (build-push-action omits --target for an empty string).
          target: ${{ matrix.target }}
          push: true
          tags: rg.${{ needs.setup.outputs.region }}.scw.cloud/${{ needs.setup.outputs.registry_ns }}/${{ matrix.service }}:${{ needs.setup.outputs.image_tag }}
          # RELEASE_SHA is baked into the image as ENV for verification later
          build-args: |
            RELEASE_SHA=${{ needs.setup.outputs.image_tag }}
          cache-from: type=registry,ref=rg.${{ needs.setup.outputs.region }}.scw.cloud/${{ needs.setup.outputs.registry_ns }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=rg.${{ needs.setup.outputs.region }}.scw.cloud/${{ needs.setup.outputs.registry_ns }}/${{ matrix.service }}:buildcache,mode=max
          provenance: false

  # -------------------------------------------------------------------------
  # Every VM `docker run`s the boot runner first.
  # -------------------------------------------------------------------------
  build-boot-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup]
    permissions:
      contents: read
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter infra... --filter shared...

      - name: Build boot runner bundle
        run: pnpm --filter infra boot:build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: rg.${{ needs.setup.outputs.region }}.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push boot runner image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: infra/boot
          file: infra/boot/Dockerfile
          push: true
          platforms: linux/amd64
          tags: rg.${{ needs.setup.outputs.region }}.scw.cloud/${{ needs.setup.outputs.registry_ns }}/infra-boot:${{ needs.setup.outputs.image_tag }}
          cache-from: type=registry,ref=rg.${{ needs.setup.outputs.region }}.scw.cloud/${{ needs.setup.outputs.registry_ns }}/infra-boot:buildcache
          cache-to: type=registry,ref=rg.${{ needs.setup.outputs.region }}.scw.cloud/${{ needs.setup.outputs.registry_ns }}/infra-boot:buildcache,mode=max
          provenance: false

  # -------------------------------------------------------------------------
  # Build frontend bundle (no upload). Runs in parallel with build-images so
  # the artifact is ready when publish-frontend gates on backend health.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # The deploy: ONE command (infra/tasks/deploy.ts) owns everything after the
  # image builds: preflights, stack lock, base stack update, waved rollout with
  # LB cutovers, public version verification, atomic frontend entry publish,
  # smoke checks, boot diagnostics on failure. CI stays a thin trigger; any CI
  # system with the SCW_* secrets can run the same command.
  # -------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    # Cold rollouts of many services (an app deploying yjs/mcp) need headroom.
    timeout-minutes: 35
    # No build-images dependency: the command's wait-for-images step is the real
    # gate, so preflights, the frontend build, and the base stack update all
    # overlap the image builds. The command builds + uploads the frontend too.
    needs: [setup]
    permissions:
      contents: read
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Full history: the frontend build's docs-frontmatter plugin derives
          # page updatedAt from git commit dates (frontend/vite/git-updated-at.ts).
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.236.0

      # Only the workspaces the deploy command touches (it builds the frontend
      # in-process): fewer packages and lifecycle scripts in the one job that
      # holds the deploy credentials.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter infra... --filter shared... --filter frontend...

      - name: Deploy ${{ needs.setup.outputs.image_tag }} to ${{ needs.setup.outputs.environment }}
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter infra run deploy --mode "${{ needs.setup.outputs.environment }}" --sha "${{ needs.setup.outputs.image_tag }}" --git-ref "${{ github.ref }}" --defer-reap

  # -------------------------------------------------------------------------
  # Reap the generations the deploy displaced. --defer-reap above leaves the
  # old VMs running (detached from every LB pool) so verification, entry
  # publish, and smoke run minutes earlier; this follow-up update destroys
  # them off the critical path. A failure here is visible but not urgent: the
  # displaced VMs only cost money, and any later stack update (including the
  # next deploy) converges them.
  # -------------------------------------------------------------------------
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, deploy]
    if: success()
    permissions:
      contents: read
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.236.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter infra... --filter shared...

      - name: Reap displaced generations in ${{ needs.setup.outputs.environment }}
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: pnpm --filter infra run reap --mode "${{ needs.setup.outputs.environment }}" --sha "${{ needs.setup.outputs.image_tag }}"

# GitHub creates one deployment record per environment-declaring job
# (secrets are environment-scoped, so that is every secret-using job,
# matrix legs included) and offers no way to opt out. The records are
# write-only audit noise; the accepted clutter keeps GitHub-specific
# pruning administration out of the deploy path.
