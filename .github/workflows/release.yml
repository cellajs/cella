name: Release

# release-please maintains a "release PR" per package from Conventional Commits.
# Merging that PR bumps the version, updates the CHANGELOG, creates the git tag
# and publishes the GitHub Release.
#
# The tag is the release: an environment that follows the releases (production, by
# default) deploys it when the runner sees it, about a minute later. Nothing in
# this file deploys, and GitHub holds no Scaleway key. A normal feature merge to
# main refreshes the release PR, and an environment that follows main deploys it.
#
# Add a new releasable package by adding an entry to .github/release-please-config.json
# and .github/release-please-manifest.json. No workflow changes needed.

permissions: {}

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Mint a short-lived token from the release GitHub App, for two reasons: the
      # release PR it opens must trigger the CI/pr-title checks required for merge,
      # which no event produced by GITHUB_TOKEN does, and the tag ruleset lets only
      # this App create the release tag.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
