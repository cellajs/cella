name: Deploy

# Thin trigger with three paths into one reusable pipeline (infra-deploy.yml):
#   push to main      -> auto staging, so main is always mirrored on staging.
#                        OPT-IN: only runs when the repo variable
#                        AUTO_DEPLOY_STAGING == 'true'. A fork that has not
#                        bootstrapped staging leaves it unset and the job skips
#                        cleanly (no failing CI), so the template is safe to pull.
#   release published -> production (gate it with a required-reviewer
#                        Environment named `production` to make it a manual
#                        promote; the deploy job already targets that Environment)
#   workflow_dispatch -> pick the environment by hand
# The pipeline itself lives in infra-deploy.yml; this file is the only one a
# fork ever edits.

permissions: {}

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

# One deploy per environment at a time. Staging (a push to main) cancels a
# superseded in-flight run so a burst of merges coalesces to the newest commit;
# production never cancels mid-rollout.
concurrency:
  group: deploy-${{ inputs.environment || (github.event_name == 'push' && 'staging') || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy:
    # Auto staging (push to main) runs only when opted in via the repo variable
    # AUTO_DEPLOY_STAGING == 'true'. Release (production) and manual dispatch
    # always run. An un-bootstrapped fork skips the push job cleanly.
    if: github.event_name != 'push' || vars.AUTO_DEPLOY_STAGING == 'true'
    uses: ./.github/workflows/infra-deploy.yml
    with:
      environment: ${{ inputs.environment || (github.event_name == 'push' && 'staging') || 'production' }}
    secrets: inherit
    permissions:
      contents: read
      deployments: write
