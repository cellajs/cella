name: Deploy

# Thin trigger: release-please releases deploy production; manual dispatch
# picks the environment. The pipeline itself lives in infra-deploy.yml (the
# reusable workflow); this file is the only one a fork ever edits.

permissions: {}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/infra-deploy.yml
    with:
      environment: ${{ inputs.environment || 'production' }}
    secrets: inherit
    permissions:
      contents: read
      deployments: write
