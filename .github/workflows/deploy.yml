name: Deploy

# Thin trigger with three paths into one reusable pipeline (deploy-pipeline.yml):
#   push to main      -> auto staging, so main is always mirrored on staging.
#                        An app built from the template must bootstrap a
#                        `staging` Environment with the SCW_* secrets before
#                        merging to main, or this job fails.
#   release published -> production (gate it with a required-reviewer
#                        Environment named `production` to make it a manual
#                        promote; the deploy job already targets that Environment)
#   workflow_dispatch -> pick the environment by hand
# The pipeline itself lives in deploy-pipeline.yml; this is the only workflow an
# app edits.

permissions: {}

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

# One deploy per environment at a time. Staging (a push to main) cancels a
# superseded in-flight run so a burst of merges coalesces to the newest commit;
# production never cancels mid-rollout.
concurrency:
  group: deploy-${{ inputs.environment || (github.event_name == 'push' && 'staging') || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy:
    uses: ./.github/workflows/deploy-pipeline.yml
    with:
      environment: ${{ inputs.environment || (github.event_name == 'push' && 'staging') || 'production' }}
    secrets: inherit
    permissions:
      contents: read
      deployments: write
