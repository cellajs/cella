name: ${PROJECT_SLUG}

volumes:
  pg_data:
  pg_test_data:
  pg_testbed_data:

services:
  db: &db
    container_name: ${PROJECT_SLUG}_db
    build: ./db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      # Postgres keeps WAL up to this ceiling after a seed: 1GB per local database by default.
      - -c
      - max_wal_size=256MB
      - -c
      - wal_level=logical
      - -c
      - max_connections=500
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=2GB
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=postgres
    ports:
      - 127.0.0.1:${DATABASE_PORT}:5432
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    # `up --wait` returns once this passes. Over TCP: on a new volume the image's init server answers on the socket
    # only, before the real server accepts connections.
    healthcheck: &db_ready
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  db_test:
    container_name: ${PROJECT_SLUG}_db_test
    build: ./db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Logical replication so CDC integration tests can create slots (matches `db`).
    command:
      - -c
      - wal_level=logical
      - -c
      - max_connections=500
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=2GB
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=postgres
    ports:
      - 127.0.0.1:${DATABASE_TEST_PORT}:5432
    profiles:
      - test
    volumes:
      - pg_test_data:/var/lib/postgresql/data
    healthcheck: *db_ready

  # Seeded database of `pnpm cella testbed`, apart from the dev database so a testbed never touches it.
  db_testbed:
    <<: *db
    container_name: ${PROJECT_SLUG}_db_testbed
    ports:
      - 127.0.0.1:${DATABASE_TESTBED_PORT:-5470}:5432
    restart: "no"
    profiles:
      - testbed
    volumes:
      - pg_testbed_data:/var/lib/postgresql/data
