---
# Disable lefthook's gradient banner / colored decorations. They render as
# garbled ANSI escapes in VS Code's Source Control & Output panels (which don't
# support 24-bit gradient codes). Keep only the meaningful summary + failures.
colors: false
output:
  - summary
  - failure
  - execution_out

pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}'
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typescript:
      # `pnpm sdk` regenerates from the working tree at commit time; stage its output so a
      # schema-shaping commit cannot record stale sdk/gen while the fresh files sit unstaged.
      run: pnpm sdk && git add sdk/gen && pnpm ts