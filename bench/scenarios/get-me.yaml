# GET /me: the cheapest signed-in request, repeated.
#
# What it answers: what the guard chain alone costs. `/me` reads nothing beyond the session and the memberships the
# guards load and cache, so its ceiling is that of the API process, not of the database.
# Each VU loops 20 times. Sustained at 100 arrivals/s (~2000 req/s).
config:
  target: "{{ $processEnvironment.BASE_URL }}"
  processor: "../src/processors/auth.ts"
  phases:
    - duration: 10
      arrivalRate: 50
      name: "ramp up"
    - duration: 15
      arrivalRate: 100
      name: "sustained"
  plugins:
    ensure:
      thresholds:
        - http.response_time.p95: 500
        - http.response_time.p99: 1000

scenarios:
  - beforeScenario: "authenticate"
    flow:
      - loop:
          - get:
              url: "/me"
              headers:
                cookie: "{{ cookie }}"
          - think: "10ms"
        count: 20
