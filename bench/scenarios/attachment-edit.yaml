# Attachment edit: the write path under a step-up, one rename per request.
#
# What it answers: how many edits per second the mutation path takes (guard chain, RLS transaction, per-field merge),
# and whether the CDC worker records every one of them. Each VU edits its own attachment 20 times; VUs that share a row
# are rare, contention is not the point here.
# Steps up: 25 → 50 → 75 → 100 arrivals/s (~1200 req/s peak), past what a laptop that also runs the stack takes.
#
# The CLI checks after the run that the worker recorded one activity per accepted edit.
config:
  target: "{{ $processEnvironment.BASE_URL }}"
  processor: "../src/processors/attachment-edit.ts"
  phases:
    - duration: 10
      arrivalRate: 25
      name: "hold 25"
    - duration: 10
      arrivalRate: 50
      name: "hold 50"
    - duration: 10
      arrivalRate: 75
      name: "hold 75"
    - duration: 10
      arrivalRate: 100
      name: "hold 100"
  plugins:
    ensure:
      maxErrorRate: 1
      thresholds:
        - http.response_time.p95: 3000

scenarios:
  - beforeScenario: "authenticate"
    flow:
      - loop:
          - function: "buildAttachmentEditPayload"
          - put:
              url: "/{{ tenantId }}/{{ orgId }}/attachments/{{ attachmentId }}"
              headers:
                Content-Type: "application/json"
                cookie: "{{ cookie }}"
              json: "{{ payload }}"
              afterResponse: "countEdit"
          - think: "50ms"
        count: 20
