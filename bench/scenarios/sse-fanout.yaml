# SSE fan-out: notify-then-fetch under many live subscribers.
#
# What it answers: whether every subscriber of one organization is told about each change and can fetch it. 90% of
# VUs subscribe to the app stream and react to notifications like the frontend's lazy-sync scheduler (merge per scope,
# then a slot in the spread window the server sends); 10% write attachment edits to generate CDC events.
# Compare modes:
#
#   SYNC_MODE=lazy      pnpm bench sse-fanout   (default: merged + spread)
#   SYNC_MODE=immediate pnpm bench sse-fanout   (fetch per notification)
#
# Key custom metrics: sse.notifications vs sync.delta_fetches (merge factor),
# sync.reaction_delay_ms (spread distribution), sync.fetch_ms (delta fetch latency).
#
# NOTE: the CLI's HTTP table (Requests / Req/s / latency) reflects ONLY the writer PUTs.
# Subscriber traffic (SSE connects + delta fetches) runs through native fetch() inside the
# processor and appears exclusively in the custom metrics above. Low Req/s is by design.
#
# expect: sse.notifications, sync.delta_fetches
# forbid: sse.errors
config:
  target: "{{ $processEnvironment.BASE_URL }}"
  processor: "../src/processors/sse-fanout.ts"
  phases:
    - duration: 10
      arrivalRate: 8
      name: "ramp subscribers"
    - duration: 20
      arrivalRate: 12
      name: "hold with writes"
  plugins:
    ensure:
      maxErrorRate: 5

scenarios:
  - name: "subscriber"
    weight: 9
    beforeScenario: "authenticate"
    flow:
      - function: "subscribeAndReact"

  - name: "writer"
    weight: 1
    beforeScenario: "authenticate"
    flow:
      - loop:
          - function: "buildAttachmentEditPayload"
          - put:
              url: "/{{ tenantId }}/{{ orgId }}/attachments/{{ attachmentId }}"
              headers:
                Content-Type: "application/json"
                cookie: "{{ cookie }}"
              json: "{{ payload }}"
              afterResponse: "countEdit"
          - think: "500ms"
        count: 20
