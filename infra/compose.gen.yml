# DO NOT EDIT: generated from infra/compose/ by `pnpm --filter infra compose:generate`.
# Edit services.config.ts (the service registry) and re-run synth.
# Deploy machinery and rationale live in infrastructure.ts.

services:
  backend:
    image: ${REGISTRY}/backend:${BACKEND_TAG:-latest}
    pull_policy: never
    profiles: [backend]
    depends_on:
      backend-release:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - '4000:4000'
      - '4005:4005'
      - '4001:4001'
      - '4002:4002'
      - '4003:4003'
      - '4004:4004'
      - '4006:4006'
    stop_grace_period: '30s'
    env_file:
      - .env
      - path: .env.runtime
        required: false
    environment:
      NODE_ENV: production
      APP_MODE: ${APP_MODE:-production}
      TZ: UTC
      APP_ORIGIN: ${APP_ORIGIN}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: '5s'
      timeout: '5s'
      retries: 3
      start_period: '15s'
    x-service:
      slug: backend
      healthPort: 4000
      healthExpectStatus: 204
      runRelease: true
      replacementStrategy: start-first
      drainSeconds: 10
      instanceType:
        production: DEV1-S
        staging: DEV1-S
      primaryRollout: true
      drainPolicy: requests
      lbRoute: path
      pathPrefix: /api
      internalPort: 4005
      dockerfile: Dockerfile
      target: backend
      s3Access: true
  backend-release:
    image: ${REGISTRY}/backend:${BACKEND_TAG:-latest}
    pull_policy: never
    profiles: [backend]
    restart: 'no'
    env_file:
      - .env
      - path: .env.runtime
        required: false
    environment:
      NODE_ENV: production
      APP_MODE: ${APP_MODE:-production}
      TZ: UTC
      SERVICE: migrate
      PG_CRON_DATABASE: rdb
      APP_ORIGIN: ${APP_ORIGIN}
  cdc:
    image: ${REGISTRY}/cdc:${CDC_TAG:-latest}
    pull_policy: never
    profiles: [cdc]
    restart: unless-stopped
    ports:
      - '4001:4001'
    stop_grace_period: '30s'
    env_file:
      - .env
      - path: .env.runtime
        required: false
    environment:
      NODE_ENV: production
      APP_MODE: ${APP_MODE:-production}
      TZ: UTC
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
      APP_ORIGIN: ${APP_ORIGIN}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4001/health']
      interval: '5s'
      timeout: '5s'
      retries: 3
      start_period: '10s'
    x-service:
      slug: cdc
      healthPort: 4001
      healthExpectStatus: 204
      runRelease: false
      replacementStrategy: stop-first
      drainSeconds: 0
      instanceType: DEV1-S
      dockerfile: Dockerfile
      target: cdc
      coHosted: true
      bindings:
        BACKEND_INTERNAL_URL: http://@{backend.internalHost}:@{backend.internalPort}
  yjs:
    image: ${REGISTRY}/yjs:${YJS_TAG:-latest}
    pull_policy: never
    profiles: [yjs]
    restart: unless-stopped
    ports:
      - '4002:4002'
    stop_grace_period: '30s'
    env_file:
      - .env
      - path: .env.runtime
        required: false
    environment:
      NODE_ENV: production
      APP_MODE: ${APP_MODE:-production}
      TZ: UTC
      APP_ORIGIN: ${APP_ORIGIN}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4002/health']
      interval: '5s'
      timeout: '5s'
      retries: 3
      start_period: '10s'
    x-service:
      slug: yjs
      healthPort: 4002
      healthExpectStatus: 204
      runRelease: false
      replacementStrategy: start-first
      drainSeconds: 5
      instanceType: DEV1-S
      drainPolicy: reconnect
      lbRoute: path
      pathPrefix: /yjs
      lbWebsockets: true
      dockerfile: Dockerfile
      target: yjs
      coHosted: true
      bindings:
        BACKEND_INTERNAL_URL: http://@{backend.internalHost}:@{backend.internalPort}
  mcp:
    image: ${REGISTRY}/backend:${MCP_TAG:-latest}
    pull_policy: never
    profiles: [mcp]
    restart: unless-stopped
    ports:
      - '4003:4003'
    stop_grace_period: '30s'
    env_file:
      - .env
      - path: .env.runtime
        required: false
    environment:
      NODE_ENV: production
      APP_MODE: ${APP_MODE:-production}
      TZ: UTC
      SERVICE: mcp
      APP_ORIGIN: ${APP_ORIGIN}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4003/health']
      interval: '5s'
      timeout: '5s'
      retries: 3
      start_period: '15s'
    x-service:
      slug: mcp
      healthPort: 4003
      healthExpectStatus: 204
      runRelease: false
      replacementStrategy: start-first
      drainSeconds: 10
      instanceType: DEV1-S
      drainPolicy: requests
      lbRoute: path
      pathPrefix: /mcp
      reusesImageOf: backend
      coHosted: true
  oauth:
    image: ${REGISTRY}/backend:${OAUTH_TAG:-latest}
    pull_policy: never
    profiles: [oauth]
    restart: unless-stopped
    ports:
      - '4004:4004'
    stop_grace_period: '30s'
    env_file:
      - .env
      - path: .env.runtime
        required: false
    environment:
      NODE_ENV: production
      APP_MODE: ${APP_MODE:-production}
      TZ: UTC
      SERVICE: oauth
      APP_ORIGIN: ${APP_ORIGIN}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4004/health']
      interval: '5s'
      timeout: '5s'
      retries: 3
      start_period: '15s'
    x-service:
      slug: oauth
      healthPort: 4004
      healthExpectStatus: 204
      runRelease: false
      replacementStrategy: start-first
      drainSeconds: 10
      instanceType: DEV1-S
      drainPolicy: requests
      lbRoute: path
      pathPrefix: /oauth
      reusesImageOf: backend
      coHosted: true
  jobs:
    image: ${REGISTRY}/backend:${JOBS_TAG:-latest}
    pull_policy: never
    profiles: [jobs]
    restart: unless-stopped
    ports:
      - '4006:4006'
    stop_grace_period: '30s'
    env_file:
      - .env
      - path: .env.runtime
        required: false
    environment:
      NODE_ENV: production
      APP_MODE: ${APP_MODE:-production}
      TZ: UTC
      SERVICE: jobs
      APP_ORIGIN: ${APP_ORIGIN}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4006/health']
      interval: '5s'
      timeout: '5s'
      retries: 3
      start_period: '15s'
    x-service:
      slug: jobs
      healthPort: 4006
      healthExpectStatus: 204
      runRelease: false
      replacementStrategy: stop-first
      drainSeconds: 0
      instanceType: DEV1-S
      reusesImageOf: backend
      coHosted: true
  frontend:
    image: ${REGISTRY}/frontend:${FRONTEND_TAG:-latest}
    pull_policy: never
    profiles: [frontend]
    restart: unless-stopped
    ports:
      - '80:80'
    stop_grace_period: '30s'
    environment:
      FRONTEND_CSP: ${FRONTEND_CSP}
      ORIGIN_HOST: ${ORIGIN_HOST}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/health']
      interval: '5s'
      timeout: '5s'
      retries: 3
      start_period: '10s'
    x-service:
      slug: frontend
      healthPort: 80
      healthExpectStatus: 200
      runRelease: false
      replacementStrategy: start-first
      drainSeconds: 0
      instanceType: DEV1-S
      drainPolicy: requests
      lbRoute: default
      dockerfile: infra/caddy/Dockerfile
      placement: host
  infra-agent:
    image: ${REGISTRY}/infra-agent:${AGENT_TAG}
    pull_policy: never
    profiles: [agent]
    restart: 'no'
    command:
      - agent
      - '--plan'
      - ${AGENT_DIR}/boot-plan.json
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/app:/opt/app
      - ${AGENT_DIR}:${AGENT_DIR}
      - /var/log/infra-boot.log:/var/log/infra-boot.log:ro
